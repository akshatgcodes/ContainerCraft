[project]
name = "containercraft"
version = "0.1.0"
description = "Docker container management CLI + REST API with a self-healing health monitor"
requires-python = ">=3.11,<3.14"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
craft = "containercraft.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
